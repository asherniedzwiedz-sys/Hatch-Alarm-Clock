[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; 2 x 1.9 MB OTA slots + 128 KB LittleFS for the web page
board_build.filesystem = littlefs
lib_deps =
  makuna/NeoPixelBus@2.8.4
  bblanchon/ArduinoJson@7.4.3
  esp32async/ESPAsyncWebServer@3.12.1
  esp32async/AsyncTCP@3.5.0
lib_ignore = I2S   ; core's Arduino I2S wrapper; we drive driver/i2s.h directly
build_src_flags = -Wall -Wextra -Werror

; Wokwi simulator build, see BENCH_TEST.md:  pio run -e wokwi -t buildfs  then  pio run -e wokwi
[env:wokwi]
extends = env:esp32
build_flags = -DWOKWI
extra_scripts = post:tools/wokwi_merge.py

; Host-side unit tests for the pure logic in src/Logic.h:  pio test -e native
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++11 -Wall -Wextra -Werror -Isrc
